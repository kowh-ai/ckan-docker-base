name: Trivy Image Scanning

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  scan:
    name: Scan Docker Images with Trivy
    runs-on: ubuntu-latest

    steps:

      - name: Check reports directory
        run: |
          if [ -d "reports" ]; then
            echo "Reports directory exists."
          else
            echo "Reports directory does not exist. Creating it now."
            mkdir -p reports
          fi
          
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan first image
        run: |
          mkdir -p reports
          # Replace image1:tag with your first Docker image
          trivy image --format json --output reports/ckan-2.11base-scan.json ckan/ckan-base:2.11

      - name: Scan second image
        run: |
          # Replace image2:tag with your second Docker image
          trivy image --format json --output reports/ckan-2.11dev-scan.json ckan/ckan-dev:2.11

      - name: Generate HTML report
        run: |
          cat > reports/summary.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <title>Trivy Scan Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              h1 { color: #333; }
              h2 { color: #666; margin-top: 30px; }
              table { border-collapse: collapse; width: 100%; margin-top: 10px; }
              th, td { border: 1px solid #ddd; padding: 8px; }
              th { background-color: #f2f2f2; text-align: left; }
              tr:nth-child(even) { background-color: #f9f9f9; }
              .critical { background-color: #ffdddd; }
              .high { background-color: #ffffcc; }
            </style>
          </head>
          <body>
            <h1>Trivy Vulnerability Scan Report</h1>
            <p>Date: $(date)</p>
            
            <h2>Summary</h2>
            <p>This report contains vulnerability scans for two Docker images.</p>
            
            <h2>Image 1 Results</h2>
            <pre>
          $(trivy image --severity CRITICAL,HIGH ckan/ckan-base:2.11)
            </pre>
            
            <h2>Image 2 Results</h2>
            <pre>
          $(trivy image --severity CRITICAL,HIGH ckan/ckan-dev:2.11)
            </pre>
            
            <h2>Detailed Reports</h2>
            <p>See the attached JSON files for detailed reports.</p>
          </body>
          </html>
          EOF

      - name: Generate text summary
        run: |
          echo "Trivy Scan Report - $(date)" > reports/summary.txt
          echo "-----------------------------------------" >> reports/summary.txt
          echo -e "\nImage 1 Summary:" >> reports/summary.txt
          trivy image --severity CRITICAL,HIGH ckan/ckan-base:2.11 >> reports/summary.txt
          echo -e "\nImage 2 Summary:" >> reports/summary.txt
          trivy image --severity CRITICAL,HIGH ckan/ckan-dev:2.11 >> reports/summary.txt

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: trivy-reports
          path: reports/
          retention-days: 7
          # This will upload the reports directory as an artifact