name: CKAN Image Scanning with Snyk
description: |
  This workflow scans Docker images for vulnerabilities using Snyk.
  It runs on a schedule and can also be triggered manually.

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  scan:
    name: Scan CKAN Docker Images with Snyk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Snyk
        uses: snyk/actions/setup@v4
        with:
          version: 'latest'

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Define image list
        id: set-images
        run: |
          # Define the list of images to scan
          echo "IMAGES_TO_SCAN<<EOF" >> $GITHUB_ENV
          echo "ckan/ckan-base:master" >> $GITHUB_ENV
          echo "ckan/ckan-base:2.11" >> $GITHUB_ENV
          echo "ckan/ckan-dev:2.11" >> $GITHUB_ENV
          echo "ckan/ckan-base:2.10-py3.10" >> $GITHUB_ENV
          echo "ckan/ckan-dev:2.10-py3.10" >> $GITHUB_ENV
          # Add more images as needed
          echo "EOF" >> $GITHUB_ENV

      - name: Scan images with Snyk
        run: |
          # Read the images line by line and scan each one
          while IFS= read -r image; do
            # Create a safe filename by replacing slashes and colons
            filename=$(echo "$image" | tr '/:' '-')
            echo "Scanning $image..."
            snyk container test "$image" --json > "reports/${filename}-scan.json"
            # Also create a text summary for this image
            echo "Summary for $image:" > "reports/${filename}-summary.txt"
            snyk container test "$image" >> "reports/${filename}-summary.txt"
          done <<< "$IMAGES_TO_SCAN"

      - name: Generate text summary
        run: |
          echo "Snyk Scan Report - $(date)" > reports/summary.txt
          echo "-----------------------------------------" >> reports/summary.txt
          
          # Add summaries for each image
          while IFS= read -r image; do
            echo -e "\nSummary for $image:" >> reports/summary.txt
            snyk container test "$image" >> reports/summary.txt
          done <<< "$IMAGES_TO_SCAN"

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: snyk-scan-reports
          path: reports/
          retention-days: 3