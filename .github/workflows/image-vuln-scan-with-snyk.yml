name: Snyk Docker Image Scan

on:
  schedule:
    # Run weekly on Monday at 9:00 AM
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  snyk-docker-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Log in to Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        
      # Scan the first Docker image
      - name: Snyk scan first Docker image
        run: |
          snyk container test ckan/ckan-base:2.11 \
            --severity-threshold=high \
            --file=Dockerfile \
            --app-vulns \
            --org=${{ secrets.SNYK_ORG }} \
            --project-name=ckan-base-2.11
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      # Scan the second Docker image
      - name: Snyk scan second Docker image
        run: |
          snyk container test ckan/ckan-base:master \
            --severity-threshold=high \
            --file=Dockerfile \
            --app-vulns \
            --org=${{ secrets.SNYK_ORG }} \
            --project-name=ckan-base-master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      # Monitor the images in Snyk for ongoing vulnerability detection
      - name: Monitor first Docker image
        run: |
          snyk container monitor ckan/ckan-base:2.11 \
            --org=${{ secrets.SNYK_ORG }} \
            --project-name=ckan-base-2.11
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          
      - name: Monitor second Docker image
        run: |
          snyk container monitor ckan/ckan-base:master \
            --org=${{ secrets.SNYK_ORG }} \
            --project-name=ckan-base-master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}