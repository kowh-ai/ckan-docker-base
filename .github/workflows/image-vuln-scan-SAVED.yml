name: CKAN Image Scanning with Trivy
description: |
  This workflow scans Docker images for vulnerabilities using Trivy.
  It runs on a schedule and can also be triggered manually. 

on:
  schedule:
    # Runs at 9:00 AM UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch:
    # Allows manual triggering of the workflow

jobs:
  scan:
    name: Scan CKAN Docker Images with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check reports directory
        run: |
          mkdir -p reports

      - name: Set up Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Define image list
        id: set-images
        run: |
          # Define the list of images to scan
          echo "IMAGES_TO_SCAN<<EOF" >> $GITHUB_ENV
          echo "ckan/ckan-base:master" >> $GITHUB_ENV
          echo "ckan/ckan-base:2.11" >> $GITHUB_ENV
          echo "ckan/ckan-dev:2.11" >> $GITHUB_ENV
          echo "ckan/ckan-base:2.10-py3.10" >> $GITHUB_ENV
          echo "ckan/ckan-dev:2.10-py3.10" >> $GITHUB_ENV
          # Add more images as needed
          echo "EOF" >> $GITHUB_ENV

      - name: Scan images
        run: |
          # Read the images line by line and scan each one
          while IFS= read -r image; do
            # Create a safe filename by replacing slashes and colons
            filename=$(echo "$image" | tr '/:' '-')
            echo "Scanning $image..."
            trivy image --format json --output "reports/${filename}-scan.json" "$image"
            # Also create a text summary for this image
            echo "Summary for $image:" > "reports/${filename}-summary.txt"
            trivy image --severity CRITICAL,HIGH "$image" >> "reports/${filename}-summary.txt"
          done <<< "$IMAGES_TO_SCAN"

      - name: Generate HTML report
        run: |
          cat > reports/summary.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>CKAN Imgaes Scan Report using Trivy</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; }
              h1 { color: #333; }
              h2 { color: #666; margin-top: 30px; }
              table { border-collapse: collapse; width: 100%; margin-top: 10px; }
              th, td { border: 1px solid #ddd; padding: 8px; }
              th { background-color: #f2f2f2; text-align: left; }
              tr:nth-child(even) { background-color: #f9f9f9; }
              .critical { background-color: #ffdddd; }
              .high { background-color: #ffffcc; }
            </style>
          </head>
          <body>
            <h1>Trivy Vulnerability Scan Report</h1>
            <p>Date: $(date)</p>
            
            <h2>Summary</h2>
            <p>This report contains vulnerability scans for multiple Docker images.</p>
          EOF
          
          # Dynamically add results for each image
          while IFS= read -r image; do
            filename=$(echo "$image" | tr '/:' '-')
            echo "<h2>Results for $image</h2>" >> reports/summary.html
            echo "<pre>" >> reports/summary.html
            trivy image --severity CRITICAL,HIGH "$image" >> reports/summary.html
            echo "</pre>" >> reports/summary.html
          done <<< "$IMAGES_TO_SCAN"
          
          # Close the HTML
          cat >> reports/summary.html << 'EOF'  
            <h2>Detailed Reports</h2>
            <p>See the attached JSON files for detailed reports.</p>
          </body>
          </html>
          EOF

      - name: Generate text summary
        run: |
          echo "Trivy Scan Report - $(date)" > reports/summary.txt
          echo "-----------------------------------------" >> reports/summary.txt
          
          # Add summaries for each image
          while IFS= read -r image; do
            echo -e "\nSummary for $image:" >> reports/summary.txt
            trivy image --severity CRITICAL,HIGH "$image" >> reports/summary.txt
          done <<< "$IMAGES_TO_SCAN"

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: reports/
          retention-days: 3